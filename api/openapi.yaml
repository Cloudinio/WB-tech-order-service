openapi: 3.0.3
info:
  title: WB Tech Order Service API
  version: 1.0.0
  description: |
    Service for receiving orders from Kafka, storing them in PostgreSQL,
    caching them in memory, and returning them via HTTP API.

servers:
  - url: http://localhost:8081

paths:
  /healthz:
    get:
      summary: Health check
      operationId: healthCheck
      tags:
        - system
      responses:
        '200':
          description: Service is healthy
          content:
            text/plain:
              schema:
                type: string
                example: ok

  /metrics:
    get:
      summary: Prometheus metrics
      operationId: getMetrics
      tags:
        - system
      responses:
        '200':
          description: Prometheus metrics output
          content:
            text/plain:
              schema:
                type: string
                example: |
                  # HELP http_requests_total Total number of HTTP requests
                  # TYPE http_requests_total counter

  /api/v1/orders/{order_uid}:
    get:
      summary: Get order by UID
      operationId: getOrderByUID
      tags:
        - orders
      parameters:
        - name: order_uid
          in: path
          required: true
          description: Unique order identifier
          schema:
            type: string
            example: b563feb7b2b84b6test
      responses:
        '200':
          description: Order found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
              examples:
                success:
                  value:
                    order_uid: b563feb7b2b84b6test
                    track_number: WBILMTESTTRACK
                    entry: WBIL
                    delivery:
                      name: Test Testov
                      phone: "+9720000000"
                      zip: "2639809"
                      city: Kiryat Mozkin
                      address: Ploshad Mira 15
                      region: Kraiot
                      email: test@gmail.com
                    payment:
                      transaction: b563feb7b2b84b6test
                      request_id: ""
                      currency: USD
                      provider: wbpay
                      amount: 1817
                      payment_dt: 1637907727
                      bank: alpha
                      delivery_cost: 1500
                      goods_total: 317
                      custom_fee: 0
                    items:
                      - chrt_id: 9934930
                        track_number: WBILMTESTTRACK
                        price: 453
                        rid: ab4219087a764ae0btest
                        name: Mascaras
                        sale: 30
                        size: "0"
                        total_price: 317
                        nm_id: 2389212
                        brand: Vivienne Sabo
                        status: 202
                    locale: en
                    internal_signature: ""
                    customer_id: test
                    delivery_service: meest
                    shardkey: "9"
                    sm_id: 99
                    date_created: "2021-11-26T06:22:19Z"
                    oof_shard: "1"

        '404':
          description: Order not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                notFound:
                  value:
                    error: order not found

        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                internalError:
                  value:
                    error: internal server error

components:
  schemas:
    OrderResponse:
      type: object
      required:
        - order_uid
        - track_number
        - entry
        - delivery
        - payment
        - items
        - locale
        - internal_signature
        - customer_id
        - delivery_service
        - shardkey
        - sm_id
        - date_created
        - oof_shard
      properties:
        order_uid:
          type: string
          example: b563feb7b2b84b6test
        track_number:
          type: string
          example: WBILMTESTTRACK
        entry:
          type: string
          example: WBIL
        delivery:
          $ref: '#/components/schemas/DeliveryResponse'
        payment:
          $ref: '#/components/schemas/PaymentResponse'
        items:
          type: array
          items:
            $ref: '#/components/schemas/ItemResponse'
        locale:
          type: string
          example: en
        internal_signature:
          type: string
          example: ""
        customer_id:
          type: string
          example: test
        delivery_service:
          type: string
          example: meest
        shardkey:
          type: string
          example: "9"
        sm_id:
          type: integer
          example: 99
        date_created:
          type: string
          format: date-time
          example: "2021-11-26T06:22:19Z"
        oof_shard:
          type: string
          example: "1"

    DeliveryResponse:
      type: object
      required:
        - name
        - phone
        - zip
        - city
        - address
        - region
        - email
      properties:
        name:
          type: string
          example: Test Testov
        phone:
          type: string
          example: "+9720000000"
        zip:
          type: string
          example: "2639809"
        city:
          type: string
          example: Kiryat Mozkin
        address:
          type: string
          example: Ploshad Mira 15
        region:
          type: string
          example: Kraiot
        email:
          type: string
          format: email
          example: test@gmail.com

    PaymentResponse:
      type: object
      required:
        - transaction
        - request_id
        - currency
        - provider
        - amount
        - payment_dt
        - bank
        - delivery_cost
        - goods_total
        - custom_fee
      properties:
        transaction:
          type: string
          example: b563feb7b2b84b6test
        request_id:
          type: string
          example: ""
        currency:
          type: string
          example: USD
        provider:
          type: string
          example: wbpay
        amount:
          type: integer
          example: 1817
        payment_dt:
          type: integer
          format: int64
          example: 1637907727
        bank:
          type: string
          example: alpha
        delivery_cost:
          type: integer
          example: 1500
        goods_total:
          type: integer
          example: 317
        custom_fee:
          type: integer
          example: 0

    ItemResponse:
      type: object
      required:
        - chrt_id
        - track_number
        - price
        - rid
        - name
        - sale
        - size
        - total_price
        - nm_id
        - brand
        - status
      properties:
        chrt_id:
          type: integer
          format: int64
          example: 9934930
        track_number:
          type: string
          example: WBILMTESTTRACK
        price:
          type: integer
          example: 453
        rid:
          type: string
          example: ab4219087a764ae0btest
        name:
          type: string
          example: Mascaras
        sale:
          type: integer
          example: 30
        size:
          type: string
          example: "0"
        total_price:
          type: integer
          example: 317
        nm_id:
          type: integer
          format: int64
          example: 2389212
        brand:
          type: string
          example: Vivienne Sabo
        status:
          type: integer
          example: 202

    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          example: order not found